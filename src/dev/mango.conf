# Mango config for the nested dev session, passed with `mango -c` by
# `task dev:run`. It keeps Mango's stock config (key bindings, Alt+Return for
# foot) and adds only the shell. `task dev:run` exports STACK_OS_SHELL (the
# repo's src/shell/ folder) and STACK_OS_DEV=1; exec_once runs through sh, so the
# variables expand and the shell inherits them.
source=/etc/mango/config.conf

# Quickshell watches the folder and reloads on every save.
exec_once=qs -p "$STACK_OS_SHELL"
