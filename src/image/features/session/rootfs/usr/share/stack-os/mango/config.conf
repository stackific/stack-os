# Mango's config for the Stack OS session, passed with `mango -c` by the
# session file. It keeps Mango's stock config (key bindings, Alt+Return for
# foot) and adds the lock binding. The shell itself is not started here: it is
# the user service stack-os-shell.service, which Mango's session target starts
# once Mango has exported its environment.
source=/etc/mango/config.conf

# Each monitor's scale, written by stack-os-scale before Mango starts and on
# hotplug (decision 04); Mango reloads it when it changes.
source_optional=~/.local/state/stack-os/monitors.conf

# A lock surface never shows the desktop through it (decision 03).
allow_lock_transparent=0

# Super+L locks through the shell's lock IPC call, as the power menu does.
bind=SUPER,l,spawn,qs -p /usr/share/stack-os/shell ipc call lock lock
