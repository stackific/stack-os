version: "3"

# Package sources. Fedora's updates-archive (fedora-repos-archive, already in
# the minimal root filesystem) keeps
# every update that reached stable, so versions the image pins stay
# installable; Terra (Fyra Labs) is the only third-party repository and ships
# Mango. terra-release (the repository file) and terra-gpg-keys (Terra's
# signing keys, which it requires) are downloaded from the URLs pinned in
# versions.yml and installed only if their sha256 sums match, so the keys
# themselves are verified, and everything after is checked against them.
# finalize turns Terra off again.
tasks:
  install:
    cmds:
      - curl -fsSL --retry 5 -o /tmp/terra-release.rpm "$TERRA_RELEASE_URL"
      - curl -fsSL --retry 5 -o /tmp/terra-gpg-keys.rpm "$TERRA_GPG_KEYS_URL"
      - printf '%s  %s\n' "$TERRA_RELEASE_SHA256" /tmp/terra-release.rpm "$TERRA_GPG_KEYS_SHA256" /tmp/terra-gpg-keys.rpm | sha256sum -c
      # The checksums stand in for the GPG check: the keys are in these RPMs.
      - dnf -y install --setopt=install_weak_deps=False --nogpgcheck /tmp/terra-release.rpm /tmp/terra-gpg-keys.rpm
      - rm /tmp/terra-release.rpm /tmp/terra-gpg-keys.rpm

  check:
    cmds:
      - check-packages
      # Only Fedora's own repositories may be enabled in the shipped image.
      - |
        bad=$(dnf repolist --enabled | awk 'NR > 1 { print $1 }' | grep -vE '^(fedora|updates)(-|$)' || true)
        [ -z "$bad" ] || { echo "third-party repo enabled: $bad"; exit 1; }
