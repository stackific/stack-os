version: "3"

# Builds and checks the Stack OS bootc image (decision 01). The Containerfile
# and the features it runs live in this folder; the build context is src/, so
# the image can copy the shell and the lock's PAM file, and output/rpms/ is
# passed as the extra context `rpms` for the Quickshell RPM.
#
# Building the minimal root filesystem needs these podman options (as Fedora's
# custom base image docs and the proof of concept use): all capabilities, the
# container_runtime_t SELinux label and /dev/fuse.
vars:
  IMAGE: localhost/stack-os:latest

tasks:
  install:
    desc: Check the tools the image build needs on the host
    preconditions:
      - sh: command -v podman
        msg: Install podman first

  build:
    desc: Build the Stack OS image as localhost/stack-os:latest
    deps: [install]
    preconditions:
      # Decision 01: the build fails if the base image is not pinned by digest.
      - sh: echo "{{.BOOTC_IMAGE}}" | grep -q '@sha256:'
        msg: Pin bootc_image by digest in versions.yml
    cmds:
      - task: :quickshell:rpm
      - >-
        podman build
        --cap-add=all --security-opt=label=type:container_runtime_t --device /dev/fuse
        -f "{{.TASKFILE_DIR}}/Containerfile"
        --build-arg BOOTC_IMAGE="{{.BOOTC_IMAGE}}"
        --build-arg QUICKSHELL_KEY="{{.QUICKSHELL_KEY}}"
        --build-arg TERRA_RELEASE_URL="{{.TERRA_RELEASE_URL}}"
        --build-arg TERRA_RELEASE_SHA256="{{.TERRA_RELEASE_SHA256}}"
        --build-arg TERRA_GPG_KEYS_URL="{{.TERRA_GPG_KEYS_URL}}"
        --build-arg TERRA_GPG_KEYS_SHA256="{{.TERRA_GPG_KEYS_SHA256}}"
        --build-context rpms="{{.ROOT_DIR}}/output/rpms"
        -t "{{.IMAGE}}"
        "{{.ROOT_DIR}}/src"

  check:
    desc: Run every feature's check inside the built image
    deps: [install]
    preconditions:
      - sh: podman image exists "{{.IMAGE}}"
        msg: Run `task image:build` first
    cmds:
      - >-
        podman run --rm --security-opt label=disable
        -v "{{.ROOT_DIR}}/src:/ctx:ro"
        -e PATH=/ctx/image/build/bin:/usr/bin:/usr/sbin
        "{{.IMAGE}}"
        go-task -d /ctx/image/build check

  # Writes the lock files from what the build installed (decision 01): the
  # minimal stage's packages to rootfs.lock, the image's to image.lock. A
  # locked build reproduces the old locks, so to update them, delete both
  # files, run `task image:build` (unlocked), then this task, then rebuild and
  # commit both files.
  lock:
    desc: Write rootfs.lock and image.lock from the built image (to update, delete them and rebuild first)
    deps: [install]
    preconditions:
      - sh: podman image exists "{{.IMAGE}}"
        msg: Run `task image:build` first
    vars:
      QUERY: "%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\\n"
    cmds:
      - >-
        podman build
        --cap-add=all --security-opt=label=type:container_runtime_t --device /dev/fuse
        -f "{{.TASKFILE_DIR}}/Containerfile" --target minimal
        --build-arg BOOTC_IMAGE="{{.BOOTC_IMAGE}}"
        -t localhost/stack-os-minimal:latest
        "{{.ROOT_DIR}}/src"
      - podman run --rm localhost/stack-os-minimal:latest rpm -qa --qf '{{.QUERY}}' | grep -v '^gpg-pubkey-' | LC_ALL=C sort >"{{.TASKFILE_DIR}}/rootfs.lock"
      - podman run --rm "{{.IMAGE}}" rpm -qa --qf '{{.QUERY}}' | grep -v '^gpg-pubkey-' | LC_ALL=C sort >"{{.TASKFILE_DIR}}/image.lock"
      - podman rmi localhost/stack-os-minimal:latest >/dev/null
      - wc -l "{{.TASKFILE_DIR}}/rootfs.lock" "{{.TASKFILE_DIR}}/image.lock"
